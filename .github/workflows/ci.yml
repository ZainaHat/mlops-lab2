name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, lab2-implementation]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint code
        run: python -m ruff check src tests

      - name: Train model
        run: python -m src.train.train

      - name: Run tests
        run: python -m pytest -v

  build-scan-push:
    name: Build scan and publish
    needs: lint-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/zainahat/mlops-lab2:${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build Docker image
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/ZainaHat/mlops-lab2 \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$IMAGE" .

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 \
            "$IMAGE"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push image and record digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE"
          DIGEST=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "### Image digest" >> "$GITHUB_STEP_SUMMARY"
          echo "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of GHCR
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker logout ghcr.io
